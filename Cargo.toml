[package]
name = "Reframe"
version = "3.1.6"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1.48", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
anyhow = "1.0"
async-trait = "0.1"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
quick-xml = { version = "0.38", features = ["serialize"] }

dataflow-rs = "2.0"
datalogic-rs = "4.0"
datafake-rs = "0.2"
swift-mt-message = "3.1"
mx-message = "3.1"

# Tracing and logging dependencies
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "ansi", "tracing-log"] }
tracing-log = "0.2"
tracing-appender = "0.2"

# System information
num_cpus = "1.17"
sys-info = "0.9"
uuid = { version = "1.18", features = ["v4", "fast-rng", "macro-diagnostics"] }
arc-swap = "1.7"
once_cell = "1.21"

regex = "1.12"
rand = "0.9"
chrono = { version = "0.4", features = ["serde"] }
serde-xml-rs = "0.8.1"

# MongoDB database client
mongodb = "3.3"
bson = { version = "2.15", features = ["chrono-0_4"] }

# OpenAPI/Swagger documentation
utoipa = { version = "5.4", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9.0", features = ["axum"] }
utoipa-axum = "0.2"
env_logger = "0.11"

# GraphQL API
async-graphql = { version = "7.0", features = ["chrono", "dynamic-schema"] }
async-graphql-axum = "7.0"
