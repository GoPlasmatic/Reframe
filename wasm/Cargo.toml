[package]
name = "reframe-wasm"
version = "3.1.9"
edition = "2024"
license = "Apache-2.0"
description = "WebAssembly bindings for Reframe transformation engine"
authors = ["Plasmatic Engineering <shankar@goplasmatic.io>"]
repository = "https://github.com/GoPlasmatic/reframe"
keywords = ["swift", "iso20022", "wasm", "webassembly", "transformation"]
categories = ["wasm", "development-tools"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Core workflow engine
dataflow-rs = "2.0"
datalogic-rs = "4.0"

# SWIFT message handling
swift-mt-message = "3.1"
mx-message = "3.1"

# WASM dependencies
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

# getrandom needs "js" feature for WASM (both versions for transitive deps)
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom = { version = "0.2", features = ["js"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async support
async-trait = "0.1"

# Regex for detection
regex = "1.12"

[dev-dependencies]
wasm-bindgen-test = "0.3"

# For local development, uncomment these patch sections:
# [patch.crates-io]
# swift-mt-message = { path = "../../SwiftMTMessage" }
# mx-message = { path = "../../MXMessage" }
# dataflow-rs = { path = "../../dataflow-rs" }
# datalogic-rs = { path = "../../datalogic-rs" }
