services:
  # MongoDB database for audit logging
  mongodb:
    image: mongo:latest
    container_name: reframe-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=reframe
    networks:
      - reframe-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Reframe application instance with package-based configuration
  reframe-app:
    build:
      context: .
      args:
        # Package URL can be configured here or via .env file
        PACKAGE_URL: ${PACKAGE_URL:-https://github.com/GoPlasmatic/reframe-package-swift-cbpr/releases/download/v2.1.1/reframe-swift-cbpr-v2.1.1.zip}
    container_name: reframe-app
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      # Mount logs directory
      - ./logs:/var/log/reframe
    environment:
      - RUST_LOG=info
      - TOKIO_WORKER_THREADS=8
      - REFRAME_PACKAGE_PATH=/packages/swift-cbpr
      - API_SERVER_URL=http://localhost:3000
      # Database configuration
      - DB_TYPE=mongodb
      - DB_URI=mongodb://mongodb:27017
      - DB_NAME=reframe
      - DB_COLLECTION=reframe_audit
    networks:
      - reframe-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Benchmark runner container
  benchmark-runner:
    build:
      context: .
      dockerfile: Dockerfile.benchmark
    container_name: benchmark-runner
    depends_on:
      reframe-app:
        condition: service_healthy
    environment:
      - REFRAME_URL=http://reframe-app:3000
      - PYTHONUNBUFFERED=1
    networks:
      - reframe-network
    command: python3 /app/test/simple_benchmark.py
    profiles:
      - benchmark

networks:
  reframe-network:
    driver: bridge

volumes:
  mongodb-data:
